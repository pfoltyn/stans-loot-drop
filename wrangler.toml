name = "stans-loot-drop"
compatibility_date = "2026-01-01"
main = "worker/index.js"

routes = [
  { pattern = "stansloot.com", custom_domain = true },
]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
invocation_logs = true

# Chat / suggestions box storage.
# Create with:  wrangler kv namespace create CHAT_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "CHAT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
