name = "stans-loot-drop"
compatibility_date = "2026-01-01"
main = "worker/index.js"

routes = [
  { pattern = "stansloot.com", custom_domain = true },
]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
invocation_logs = true
